services:
  - type: web
    name: day14-ai-agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-agent-redis
          property: connectionString

  - type: keyvalue
    name: day14-agent-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
